<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1522 664" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="1522" height="664" fill="#ffffff"/>
<text x="761.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#16242f">16. DXRRayTracing — 핵심 개념 한눈에 보기</text>
<text x="761.0" y="86" text-anchor="middle" font-size="16" fill="#5b7387">씬을 가속 구조로 만들고, 상태 객체와 셰이더 테이블을 준비해, 픽셀마다 광선을 쏴 그림자를 구하는 흐름</text>

<rect x="40" y="116" width="212" height="282" rx="14" fill="#edf3f8"/>
<text x="146.0" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">BLAS</text>
<text x="146.0" y="172" text-anchor="middle" font-size="14" fill="#41607a">(하단 가속 구조)</text>
<text x="146.0" y="268" text-anchor="middle" font-size="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🧊</text>
<text x="146.0" y="310" text-anchor="middle" font-size="13.5" fill="#33475b">큐브 메시와 바닥을</text>
<text x="146.0" y="331" text-anchor="middle" font-size="13.5" fill="#33475b">각각 하나씩,</text>
<text x="146.0" y="352" text-anchor="middle" font-size="13.5" fill="#33475b">시작할 때 딱 한 번</text>
<path d="M 260.0 246.0 L 278.0 257.0 L 260.0 268.0 Z" fill="#a5c1d6"/>

<rect x="286" y="116" width="212" height="282" rx="14" fill="#edf3f8"/>
<text x="392.0" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">TLAS</text>
<text x="392.0" y="172" text-anchor="middle" font-size="14" fill="#41607a">(상단 가속 구조)</text>
<text x="392.0" y="268" text-anchor="middle" font-size="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🌳</text>
<text x="392.0" y="310" text-anchor="middle" font-size="13.5" fill="#33475b">인스턴스 17개가</text>
<text x="392.0" y="331" text-anchor="middle" font-size="13.5" fill="#33475b">BLAS를 나눠 쓰며,</text>
<text x="392.0" y="352" text-anchor="middle" font-size="13.5" fill="#33475b">매 프레임 재빌드</text>
<path d="M 506.0 246.0 L 524.0 257.0 L 506.0 268.0 Z" fill="#a5c1d6"/>

<rect x="532" y="116" width="212" height="282" rx="14" fill="#edf3f8"/>
<text x="638.0" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">State Object</text>
<text x="638.0" y="172" text-anchor="middle" font-size="14" fill="#41607a">(상태 객체)</text>
<text x="638.0" y="268" text-anchor="middle" font-size="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">⚙️</text>
<text x="638.0" y="310" text-anchor="middle" font-size="13.5" fill="#33475b">실행될 수 있는 셰이더</text>
<text x="638.0" y="331" text-anchor="middle" font-size="13.5" fill="#33475b">전부를 묶은,</text>
<text x="638.0" y="352" text-anchor="middle" font-size="13.5" fill="#33475b">레이트레이싱판 PSO</text>
<path d="M 752.0 246.0 L 770.0 257.0 L 752.0 268.0 Z" fill="#a5c1d6"/>

<rect x="778" y="116" width="212" height="282" rx="14" fill="#edf3f8"/>
<text x="884.0" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">Shader Table</text>
<text x="884.0" y="172" text-anchor="middle" font-size="14" fill="#41607a">(셰이더 테이블)</text>
<text x="884.0" y="268" text-anchor="middle" font-size="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📇</text>
<text x="884.0" y="310" text-anchor="middle" font-size="13.5" fill="#33475b">GPU가 맞은 물체에</text>
<text x="884.0" y="331" text-anchor="middle" font-size="13.5" fill="#33475b">따라 어떤 셰이더를</text>
<text x="884.0" y="352" text-anchor="middle" font-size="13.5" fill="#33475b">돌릴지 찾아보는 표</text>
<path d="M 998.0 246.0 L 1016.0 257.0 L 998.0 268.0 Z" fill="#a5c1d6"/>

<rect x="1024" y="116" width="212" height="282" rx="14" fill="#edf3f8"/>
<text x="1130.0" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">DispatchRays</text>
<text x="1130.0" y="172" text-anchor="middle" font-size="14" fill="#41607a">(광선 쏘기)</text>
<text x="1130.0" y="268" text-anchor="middle" font-size="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">✨</text>
<text x="1130.0" y="310" text-anchor="middle" font-size="13.5" fill="#33475b">픽셀마다 카메라 광선,</text>
<text x="1130.0" y="331" text-anchor="middle" font-size="13.5" fill="#33475b">맞은 자리에서 다시</text>
<text x="1130.0" y="352" text-anchor="middle" font-size="13.5" fill="#33475b">빛을 향해 그림자 광선</text>
<path d="M 1244.0 246.0 L 1262.0 257.0 L 1244.0 268.0 Z" fill="#a5c1d6"/>

<rect x="1270" y="116" width="212" height="282" rx="14" fill="#edf3f8"/>
<text x="1376.0" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">Composite</text>
<text x="1376.0" y="172" text-anchor="middle" font-size="14" fill="#41607a">(색상 패스에서 합성)</text>
<text x="1376.0" y="268" text-anchor="middle" font-size="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🖼️</text>
<text x="1376.0" y="310" text-anchor="middle" font-size="13.5" fill="#33475b">그림자 마스크를</text>
<text x="1376.0" y="331" text-anchor="middle" font-size="13.5" fill="#33475b">픽셀 셰이더가 읽어</text>
<text x="1376.0" y="352" text-anchor="middle" font-size="13.5" fill="#33475b">라스터 화면에 반영</text>

<line x1="40" y1="428" x2="1482" y2="428" stroke="#dbe6ee" stroke-width="2"/>
<text x="761.0" y="466" text-anchor="middle" font-size="19" font-weight="700" fill="#16242f">셰이더 테이블 레코드는 왜 stride가 필요할까?</text>
<text x="761.0" y="492" text-anchor="middle" font-size="14" fill="#5b7387">레코드마다 담긴 내용이 다르기 때문에, GPU는 정해진 간격만큼 건너뛰어 자기 레코드를 찾아간다</text>

<text x="150.0" y="546" text-anchor="end" font-size="14" font-weight="700" fill="#1d3345">HitGroup 레코드 0</text>
<text x="150.0" y="566" text-anchor="end" font-size="13" fill="#5b7387">큐브 인스턴스 16개가 선택</text>
<rect x="176" y="524" width="300" height="52" rx="8" fill="#dce9f3" stroke="#a5c1d6" stroke-width="1.5"/>
<text x="326.0" y="548" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3345">셰이더 식별자</text>
<text x="326.0" y="567" text-anchor="middle" font-size="12.5" fill="#41607a">CubeHitGroup · 32바이트</text>
<rect x="476" y="524" width="290" height="52" rx="8" fill="#e6f2e8" stroke="#a8ccb0" stroke-width="1.5"/>
<text x="621.0" y="548" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22402c">로컬 루트 인자</text>
<text x="621.0" y="567" text-anchor="middle" font-size="12.5" fill="#3d6349">큐브 정점·인덱스 주소 · 16바이트</text>
<rect x="766" y="524" width="82" height="52" rx="8" fill="#f0f2f4" stroke="#ccd5dd" stroke-width="1.5"/>
<text x="807.0" y="555" text-anchor="middle" font-size="12.5" fill="#6b7b8a">정렬 여백</text>

<text x="150.0" y="616" text-anchor="end" font-size="14" font-weight="700" fill="#1d3345">HitGroup 레코드 1</text>
<text x="150.0" y="636" text-anchor="end" font-size="13" fill="#5b7387">바닥 인스턴스 1개가 선택</text>
<rect x="176" y="594" width="300" height="52" rx="8" fill="#dce9f3" stroke="#a5c1d6" stroke-width="1.5"/>
<text x="326.0" y="618" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d3345">셰이더 식별자</text>
<text x="326.0" y="637" text-anchor="middle" font-size="12.5" fill="#41607a">PlaneHitGroup · 32바이트</text>
<rect x="476" y="594" width="290" height="52" rx="8" fill="#e6f2e8" stroke="#a8ccb0" stroke-width="1.5"/>
<text x="621.0" y="618" text-anchor="middle" font-size="13.5" font-weight="700" fill="#22402c">로컬 루트 인자</text>
<text x="621.0" y="637" text-anchor="middle" font-size="12.5" fill="#3d6349">바닥 정점·인덱스 주소 · 16바이트</text>
<rect x="766" y="594" width="82" height="52" rx="8" fill="#f0f2f4" stroke="#ccd5dd" stroke-width="1.5"/>
<text x="807.0" y="625" text-anchor="middle" font-size="12.5" fill="#6b7b8a">정렬 여백</text>

<line x1="176" y1="586" x2="848" y2="586" stroke="#b9c8d4" stroke-width="1" stroke-dasharray="4 4"/>
<text x="900" y="556" font-size="13.5" fill="#33475b">두 레코드는 셰이더 코드가 같고</text>
<text x="900" y="578" font-size="13.5" fill="#33475b">가리키는 버퍼 주소만 다르다.</text>
<text x="900" y="608" font-size="13.5" fill="#33475b">그래서 TLAS 인스턴스의</text>
<text x="900" y="630" font-size="13.5" fill="#33475b">InstanceContributionToHitGroupIndex가</text>
<text x="900" y="652" font-size="13.5" fill="#33475b">0이냐 1이냐로 읽을 메시가 갈린다.</text>
</svg>
