<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1522 422" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="1522" height="422" fill="#ffffff"/>
<text x="761.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#16242f">11. ComputeShader — 핵심 개념 한눈에 보기</text>
<text x="761.0" y="86" text-anchor="middle" font-size="16" fill="#5b7387">그리기 파이프라인 없이, 완성된 화면을 컴퓨트 셰이더로 흐릿하게(블러) 후처리하는 흐름</text>
<rect x="40" y="116" width="212" height="282" rx="14" fill="#edf3f8"/>
<text x="146.0" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">Compute Shader</text>
<text x="146.0" y="172" text-anchor="middle" font-size="14" fill="#41607a">(컴퓨트 셰이더)</text>
<text x="146.0" y="268" text-anchor="middle" font-size="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🧮</text>
<text x="146.0" y="310" text-anchor="middle" font-size="13.5" fill="#33475b">래스터화 없이</text>
<text x="146.0" y="331" text-anchor="middle" font-size="13.5" fill="#33475b">GPU에서 계산만</text>
<text x="146.0" y="352" text-anchor="middle" font-size="13.5" fill="#33475b">시키는 프로그램</text>
<path d="M 260.0 246.0 L 278.0 257.0 L 260.0 268.0 Z" fill="#a5c1d6"/>
<rect x="286" y="116" width="212" height="282" rx="14" fill="#edf3f8"/>
<text x="392.0" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">numthreads</text>
<text x="392.0" y="172" text-anchor="middle" font-size="14" fill="#41607a">(스레드 그룹)</text>
<text x="392.0" y="268" text-anchor="middle" font-size="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">👥</text>
<text x="392.0" y="310" text-anchor="middle" font-size="13.5" fill="#33475b">한 번에 실행하는</text>
<text x="392.0" y="331" text-anchor="middle" font-size="13.5" fill="#33475b">일꾼 묶음 크기.</text>
<text x="392.0" y="352" text-anchor="middle" font-size="13.5" fill="#33475b">여기선 8x8=64명</text>
<path d="M 506.0 246.0 L 524.0 257.0 L 506.0 268.0 Z" fill="#a5c1d6"/>
<rect x="532" y="116" width="212" height="282" rx="14" fill="#edf3f8"/>
<text x="638.0" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">Dispatch</text>
<text x="638.0" y="172" text-anchor="middle" font-size="14" fill="#41607a">(디스패치)</text>
<text x="638.0" y="268" text-anchor="middle" font-size="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📣</text>
<text x="638.0" y="310" text-anchor="middle" font-size="13.5" fill="#33475b">“이만큼의 그룹을</text>
<text x="638.0" y="331" text-anchor="middle" font-size="13.5" fill="#33475b">통째로 실행해줘”라고</text>
<text x="638.0" y="352" text-anchor="middle" font-size="13.5" fill="#33475b">GPU에 내리는 명령</text>
<path d="M 752.0 246.0 L 770.0 257.0 L 752.0 268.0 Z" fill="#a5c1d6"/>
<rect x="778" y="116" width="212" height="282" rx="14" fill="#edf3f8"/>
<text x="884.0" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">SRV</text>
<text x="884.0" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">(Texture2D)</text>
<text x="884.0" y="192" text-anchor="middle" font-size="14" fill="#41607a">(원본 읽기)</text>
<text x="884.0" y="268" text-anchor="middle" font-size="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📖</text>
<text x="884.0" y="310" text-anchor="middle" font-size="13.5" fill="#33475b">블러링할 원본</text>
<text x="884.0" y="331" text-anchor="middle" font-size="13.5" fill="#33475b">이미지를 읽기</text>
<text x="884.0" y="352" text-anchor="middle" font-size="13.5" fill="#33475b">전용으로 보는 뷰</text>
<path d="M 998.0 246.0 L 1016.0 257.0 L 998.0 268.0 Z" fill="#a5c1d6"/>
<rect x="1024" y="116" width="212" height="282" rx="14" fill="#edf3f8"/>
<text x="1130.0" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">UAV</text>
<text x="1130.0" y="170" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">(RWTexture2D)</text>
<text x="1130.0" y="192" text-anchor="middle" font-size="14" fill="#41607a">(결과 쓰기)</text>
<text x="1130.0" y="268" text-anchor="middle" font-size="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🖊️</text>
<text x="1130.0" y="310" text-anchor="middle" font-size="13.5" fill="#33475b">컴퓨트 셰이더가</text>
<text x="1130.0" y="331" text-anchor="middle" font-size="13.5" fill="#33475b">읽기+쓰기 모두</text>
<text x="1130.0" y="352" text-anchor="middle" font-size="13.5" fill="#33475b">가능한 리소스 뷰</text>
<path d="M 1244.0 246.0 L 1262.0 257.0 L 1244.0 268.0 Z" fill="#a5c1d6"/>
<rect x="1270" y="116" width="212" height="282" rx="14" fill="#edf3f8"/>
<text x="1376.0" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3345">Resolve→Blur→Copy</text>
<text x="1376.0" y="172" text-anchor="middle" font-size="14" fill="#41607a">(최종 흐름)</text>
<text x="1376.0" y="268" text-anchor="middle" font-size="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🌀</text>
<text x="1376.0" y="310" text-anchor="middle" font-size="13.5" fill="#33475b">MSAA 리졸브 →</text>
<text x="1376.0" y="331" text-anchor="middle" font-size="13.5" fill="#33475b">3x3 박스 블러 →</text>
<text x="1376.0" y="352" text-anchor="middle" font-size="13.5" fill="#33475b">백버퍼로 복사</text>
</svg>